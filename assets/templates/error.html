{{template "header.html" .}}
<title>Error {{.Message}}</title>
<meta name="description" content="An error occurred on Flinternet. {{.Message}}">
</head>
<body>
    {{template "nav.html" .}}

    <main class="container home-hero">
        <h1 class="accent" style="font-size: 6rem;">Oops!</h1>
        <h2 style="font-size: 2rem; margin-bottom: 2rem;">{{.Message}}</h2>
        
        {{if .Detail}}
            <div style="background: var(--surface); padding: 1rem 2rem; border-radius: 8px; font-family: monospace; color: var(--accent); border: 1px solid var(--border); margin-bottom: 2rem;">
                {{.Detail}}
            </div>
        {{end}}

        <a href="/" class="back-link-fallback logo" style="display: inline-block; padding: 1rem 3rem; background: var(--surface); border: 2px solid var(--border); border-radius: 100px; font-size: 1.1rem;">
            Go back
        </a>

    </main>
{{template "footer.html" .}}
