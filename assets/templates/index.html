{{template "header.html" .}}
<title>Flinternet - Privacy Respecting Pinterest Search</title>
<meta name="description" content="Search and explore Pinterest pins, videos, and boards with total privacy. No tracking, no ads.">
</head>
<body>
    <div class="home-hero container">
        <h1 class="logo">Flinternet</h1>
        <p>Your privacy, your search. Search Pinterest without tracking.</p>
        
        <form class="search-form" action="/search/pins/" method="get" autocomplete="off">
            <div class="search-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <input type="text" name="q" placeholder="Search..." autofocus required>
            <button type="submit" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </form>
    </div>

    <footer class="container" style="margin-top: auto; padding: 4rem 1rem;">
        <div class="footer-links">
            <a href="https://github.com/flinternet/flinternet" target="_blank">Source code</a>
            <a href="/legal">Legal notice</a>
        </div>
        <div class="footer-copy" style="margin-top: 1rem; color: var(--text-dim); font-size: 0.8rem;">
            &copy; {{version | versionYear}} Flinternet. Built with privacy in mind.
        </div>
    </footer>
{{template "footer.html" .}}
