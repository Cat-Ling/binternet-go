{{template "header.html" .}}
<title>{{.Query}} - Flinternet Ideas</title>
<meta name="description" content="Explore {{.Query}} ideas and inspiration on Flinternet.">
</head>

<body>
    {{template "nav.html" .}}

    <main class="container" style="padding-top: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; text-transform: capitalize;">{{.Query}}</h1>
        </div>

        <div class="grid">
            {{if .Media}}
                {{template "pin_grid.html" .}}
            {{else}}
                <div style="grid-column: 1 / -1; text-align: center; padding: 3rem 0; color: var(--text-dim);">
                    <p>No ideas found.</p>
                </div>
            {{end}}
        </div>
    </main>

    <div class="container" style="text-align: center; padding: 2rem 0;">
        <a href="/search/pins/?q={{.Query}}" class="load-more">
            More Like This
        </a>
    </div>

    {{if .HasVideo}}
    <script src="/static/hls.light.min.js"></script>
    {{end}}

    <script>
        function toggleMute(btn) {
            const container = btn.closest('.video-container');
            const video = container.querySelector('video');
            const isMuted = !video.muted;
            
            document.querySelectorAll('video').forEach(function(v) {
                v.muted = isMuted;
                updateMuteUI(v.closest('.video-container'), isMuted);
            });
            
            localStorage.setItem('videoMuted', isMuted);
        }

        function updateMuteUI(container, isMuted) {
            const btn = container.querySelector('.mute-toggle');
            if (!btn) return;
            if (isMuted) {
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.58.45-1.24.8-1.95.98v2.06c1.26-.26 2.39-.81 3.37-1.56l2.3 2.3 1.27-1.27L4.27 3zM10 15.17L7.83 13H5v-2h2.83l.88-.88L10 11.41v3.76zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
            } else {
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var globalMuted = localStorage.getItem('videoMuted') === 'false' ? false : true;
            var containers = document.querySelectorAll('.video-container');

            function initVideo(container) {
                if (container.dataset.initialized) return;
                container.dataset.initialized = "true";

                var video = container.querySelector('video');
                var progressBar = container.querySelector('.video-progress-bar');
                var src = video.getAttribute('data-src');
                if (!src) return;

                var isM3U8 = src.indexOf('.m3u8') !== -1;

                video.muted = globalMuted;
                updateMuteUI(container, globalMuted);

                if (isM3U8) {
                    if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = src;
                    } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        var hls = new Hls({ capLevelToPlayerSize: true, autoStartLoad: false });
                        hls.loadSource(src);
                        hls.attachMedia(video);
                        
                        var preloaded = false;
                        var preloadVideo = function() {
                            if (!preloaded) {
                                hls.startLoad();
                                preloaded = true;
                            }
                        };
                        container.addEventListener('mouseenter', preloadVideo);
                        container.addEventListener('touchstart', preloadVideo, {passive: true});
                        video.addEventListener('play', preloadVideo); // Just in case
                    }
                } else {
                    video.src = src;
                }

                container.addEventListener('click', function(e) {
                    if (e.target.closest('.mute-toggle')) return;
                    if (video.paused) {
                        // Immediately pause all other videos to free bandwidth
                        document.querySelectorAll('video').forEach(function(otherVideo) {
                            if (otherVideo !== video && !otherVideo.paused) {
                                otherVideo.pause();
                                var otherContainer = otherVideo.closest('.video-container');
                                if (otherContainer) {
                                    otherContainer.classList.add('paused');
                                    otherContainer.classList.remove('loading');
                                }
                            }
                        });
                        
                        if (video.readyState < 3) {
                            container.classList.add('loading');
                        }
                        video.play();
                        container.classList.remove('paused');
                    } else {
                        window.location.href = '/pin/' + container.getAttribute('data-pin-id');
                    }
                });

                video.addEventListener('waiting', function() {
                    container.classList.add('loading');
                });

                video.addEventListener('playing', function() {
                    container.classList.remove('loading');
                });

                video.addEventListener('timeupdate', function() {
                    var percent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = percent + '%';
                });

                var progressContainer = container.querySelector('.video-progress-container');
                progressContainer.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var rect = progressContainer.getBoundingClientRect();
                    var pos = (e.pageX - rect.left) / rect.width;
                    video.currentTime = pos * video.duration;
                });

                video.addEventListener('ended', function() {
                    container.classList.add('paused');
                });
                
                updateMuteUI(container, video.muted);
                if (video.paused) container.classList.add('paused');
            }

            if ('IntersectionObserver' in window) {
                var observer = new IntersectionObserver(function(entries, observer) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            initVideo(entry.target);
                            observer.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '200px' });
                containers.forEach(function(container) {
                    observer.observe(container);
                });
            } else {
                containers.forEach(initVideo);
            }
        });
    </script>

{{template "footer.html" .}}
