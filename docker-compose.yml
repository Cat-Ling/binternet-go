version: '3.8'

services:
  flinternet:
    build: .
    image: github.com/flinternet/flinternet:latest
    container_name: flinternet-server
    ports:
      - "8021:8021"
    restart: unless-stopped
    environment:
      - FLINTERNET_SHOW_ERRORS_TO_CLIENT=false
      - FLINTERNET_FALLBACK_DNS=1.1.1.1
    # Uncomment to mount a local .env file
    # env_file:
    #   - .env
