version: '3.8'

services:
  binternet:
    build: .
    image: binternet-go:latest
    container_name: binternet-go
    ports:
      - "8021:8021"
    restart: unless-stopped
    environment:
      - BINTERNET_SHOW_ERRORS_TO_CLIENT=false
      - BINTERNET_FALLBACK_DNS=1.1.1.1
    # Uncomment to mount a local .env file
    # env_file:
    #   - .env
